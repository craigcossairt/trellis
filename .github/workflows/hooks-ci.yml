          bash bin/tests/test-claim-branch-lease.sh

      - name: Suite - push gate (pre-push hook + verify-green)
        run: |
          # Mutation ledger, measured 2026-09-08 over 27 cases:
          #
          #   green enablement probe collapsed to one branch  3 -> 3 red
          #     ABSENT, OFF and BROKEN are three facts about verify-green.sh.
          #     `! bash "$VERIFY" --check-configured` mapped the last two
          #     together, so a script with a syntax error disabled the gate
          #     silently on a repo that HAD configured it - this repo's own
