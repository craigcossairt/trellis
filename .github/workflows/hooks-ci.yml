          #   block hook: drop the CDPATH='' prefix only     1 -> 1 red (decoy)
          #   block hook: drop >/dev/null only               0 -> 0 red
          #     Belt and braces: an empty CDPATH alone already stops the echo.
          #   block hook: unguarded cd                       3 -> 3 red
          #   adapter (run-claude-hook.sh): unguarded cd     1 -> 1 red
          #   installer: unguarded cd                        1 -> 1 red
          bash bin/tests/test-check-cdpath-cd.sh

      # ---- optional, opt-in tooling --------------------------------------
      # Each suite below guards something a fresh copy never enables. They
      # still run on every pull request: an opt-in guard that rots while
      # nobody has it switched on fails the first project that does. Each step
      # is skipped only when its subject file has been pruned (SETUP.md § 5).

      - name: Suite - check-main-checkouts (opt-in shared checkout)
        if: hashFiles('bin/check-main-checkouts.sh') != ''
        run: |
          # Reports the END state a command-line guard cannot see: a main
          # checkout off its default branch, dirty, or carrying a repo-local
          # git identity. Three exit states: 0 parked, 1 problem, 2 could not
          # check (outranks 1, and every finding still prints). Linked worktree
          # vs main checkout is git dir vs common dir, never the shape of .git:
          # a --separate-git-dir main checkout has a .git FILE. 30 cases.
          #
          # Mutation ledger, measured 2026-10-01, predicted -> observed red:
          #
          #   untracked files not listed                      3 -> 3
          #   --no-optional-locks dropped (index write)       1 -> 1
          #   prefix match on the branch name                 1 -> 1
          #   detached HEAD read as clean                     1 -> 1
          #   found (1) outranks could-not-check (2)          1 -> 1
          #   a failed git status read as clean               1 -> 1
          #   linked-worktree refusal removed                 1 -> 1
          #   linked-vs-main decided by .git being a file     2 -> 2
          #   user.name not checked                           1 -> 1
          #   repo-local identity read as clean               3 -> 3
          #   cannot() stops setting could-not-check          6 -> 6
          #   "and N more" suffix dropped                     1 -> 1
          #   inherited GIT_DIR not cleared                   1 -> 1
          #   project.defaultBranch ignored (always main)     2 -> 2
          #   includeIf remedy dropped from the message       1 -> 1
          #
          # Added 2026-10-01 (CodeRabbit on #31), predicted -> observed red:
          #
          #   symbolic-ref --short compared (tag named main)  1 -> 1
          #   refs/heads/ prefix left in the report           1 -> 1
          bash bin/tests/test-check-main-checkouts.sh

      - name: Suite - session-start main-checkout section (opt-in)
        if: hashFiles('bin/check-main-checkouts.sh') != ''
        run: |
          # Pins the opt-in wiring in session-start.sh, where a working check
          # goes quietly dead or leaks into projects that never asked: unmarked,
          # the checker never runs and nothing prints; marked, a session in a
          # linked worktree still judges the MAIN checkout; a checker that is
          # missing or fails says MISSING or FAILED, never nothing; a
          # --separate-git-dir main checkout is still found; a marker read that
          # fails (not "not set") says FAILED; an inherited GIT_DIR cannot answer
          # for another repo. 16 cases.
          # (The unmarked output is also byte-identical to the hook before this
          # section existed; that was checked once by hand, not here.)
          #
          # Mutation ledger, measured 2026-10-01, predicted -> observed red:
          #
          #   opt-in gate removed                             3 -> 3
          #   MISSING branch silenced                         1 -> 1
          #   FAILED (exit 2) branch silenced                 1 -> 1
          #   exit 1 not reported as "not parked"             2 -> 3
          #     The extra red is the separate-git-dir off-main case, added after
          #     this prediction was written; it reports through exit 1 too.
          #   session root passed instead of main checkout    2 -> 2
          #   non-boolean marker silenced                     1 -> 1
          #   main checkout always from `git worktree list`   2 -> 2
          #     (git names the separate git dir there, not the checkout)
          #   session top level used even from a worktree     2 -> 2
          #
          # Added 2026-10-01 (CodeRabbit on #31), predicted -> observed red:
          #
          #   repo-local git variables not dropped            1 -> 1
          #   failed marker read treated as not set           1 -> 1
          #   "not set" (exit 1) also reported as FAILED      1 -> 1
          bash bin/tests/test-session-start-main-checkout.sh

      # node is preinstalled on ubuntu-latest, but its version is the image's
      # choice. The suite uses node:test and the hook uses optional chaining,
      # so pin a major rather than inherit whatever the image ships.
      - uses: actions/setup-node@v7
        if: hashFiles('.claude/hooks/heredoc-backslash-warn.mjs') != ''
        with:
          node-version: '22'

      - name: Suite - heredoc backslash warning (optional hook)
        if: hashFiles('.claude/hooks/heredoc-backslash-warn.mjs') != ''
        run: |
          # Optional, not wired by default (.claude/hooks/README.md). Warns,
          # never blocks, when a Bash command feeds a heredoc body holding a
          # backslash to python/node/bun/perl as SOURCE: the interpreter turns
          # escapes meant for the output into real CR/NUL/backspace bytes. Data
          # for a script (`python3 x.py <<EOF`) stays silent; an unparseable
          # payload is reported, not silent. Every case runs the real hook with
          # a PreToolUse payload on stdin. 64 cases.
          #
          # Mutation ledger, measured 2026-09-30, predicted -> observed red:
          #
          #   backslash test dropped (warn on any body)       4 -> 4
          #   runner gating removed (`echo python -`)         1 -> 1
          #   runners cut to env/exec/command/time/sudo       4 -> 4
          #   `<<<` here-string guard removed                 1 -> 1
          #   `<<-` tab strip dropped                         1 -> 1
          #   unparseable payload read as silence             3 -> 3
          #   JSON array accepted as a payload                1 -> 1
          #   `&` of `2>&1` read as a separator               1 -> 1
          #   `(` not a separator (heredoc inside `$( )`)     1 -> 1
          #   no separator cut at all                         3 -> 3
          #   interpreter path/.exe not normalised            1 -> 1
          #   tool_name check removed                         1 -> 1
          #   script path read as source                      5 -> 5
          #   `||` read as a pipe                             1 -> 1
          #   `> file` target read as a script path           1 -> 1
          #   `bun run` not skipped                           1 -> 1
          #   could-not-run made blocking (exit 2)            3 -> 3
          #   chr(92) remedy dropped from the message        26 -> 26
          #
          # Added 2026-10-01 (CodeRabbit on #31), predicted -> observed red:
          #
          #   --eval= read as a flag, not the program         1 -> 1
          #   words after the heredoc operator ignored        2 -> 2
          #   separate option value read as a script path     1 -> 1
          #   node -C dropped from the valued letters         1 -> 1
          #
          # Added 2026-10-01 (CodeRabbit on #31, second round), over 64 cases;
          # the rows above were measured before these seven cases existed:
          #
          #   whitespace split kept the quotes                3 -> 3
          #   runner scans past a non-runner wrapped word     2 -> 2
          #   runner option values not skipped (-n, -u)       2 -> 2
          #   timeout duration read as the wrapped command    1 -> 1
          #   uv subcommand not checked for `run`             1 -> 1
          #
          # A perl -0/-l digit-skip branch was predicted 1 red and gave 0: the
          # x of -0x1e already takes the rest of the cluster, so the branch was
          # dead and was removed rather than kept untested.
          node --test .claude/hooks/tests/heredoc-backslash-warn.test.mjs

      - name: JSON config is parseable
        run: |
          # settings.json wires every hook in this repo, and hooks.json does the
          # same for Cursor and Grok. A trailing comma in any of them is not an
          # error the harness reports - it declines to load the file and the
          # guardrails silently cease to exist.
          fail=0
          for f in .claude/settings.json .cursor/hooks.json .grok/hooks/hooks.json .codex/hooks.json .mcp.json.example; do
            [ -f "$f" ] || continue
            if node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" 2>/dev/null; then
              echo "ok $f"
            else
              echo "::error file=$f::not valid JSON - the harness will silently decline to load it"
              node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || true
              fail=1
            fi
          done
          exit $fail

      - name: Claude hook timeouts are in seconds
        run: |
          # Claude Code reads a hook's `timeout` in SECONDS. This template once
          # shipped 10000 / 30000 / 5000 - millisecond values - so a hung hook
          # could hold a session for hours instead of seconds, and nothing
          # complained because a too-large timeout never fires. Claude Code's
          # own default ceiling is 600s, so anything above it is a unit error.
          [ -f .claude/settings.json ] || { echo "no .claude/settings.json - nothing to check"; exit 0; }
          node -e '
            const s = JSON.parse(require("fs").readFileSync(".claude/settings.json", "utf8"));
            let seen = 0, bad = 0;
            const walk = (o, p) => {
              if (Array.isArray(o)) return o.forEach((v, i) => walk(v, p + "[" + i + "]"));
              if (o && typeof o === "object") for (const [k, v] of Object.entries(o)) {
                if (k === "timeout") {
                  seen++;
                  if (typeof v !== "number" || v > 600) {
                    bad++;
                    console.log("::error file=.claude/settings.json::" + p + " timeout " + v + " - Claude Code reads seconds; above 600 is almost certainly milliseconds");
                  }
                }
                walk(v, p + "/" + k);
              }
            };
            walk(s, "");
            console.log("checked " + seen + " timeout(s), " + bad + " out of range");
            process.exit(bad ? 1 : 0);
          '

      - name: Suite - trellis-sync (classification + manifest)
        run: |
          # The whole value of sync is one distinction: "I changed this" vs
          # "upstream changed this". Wrong in one direction it nags about files
          # you meant to change; wrong in the other it overwrites your work.
          # 93 cases, and every one asserts the exact bucket rather than just
          # that something was reported.
          #
          # Mutation ledger, measured 2026-09-22 over 62 cases. Predictions were
          # written before each run, and every extra red is accounted for: an
          # unexplained extra red is as much a signal as a missing one.
          #
          #   record from the working tree (the --write bug)  1 predicted, 2 red
          #     Extra: "and nothing is outstanding" - once the declined edit is
          #     misfiled as `apply` the run exits 1, not 0. A consequence.
          #   recording sweeps in untracked files            3 -> 3 red
          #   post-fetch hash verification dropped           3 -> 3 red
          #     Was 4 until the unreadable-file case got its OWN copy. It shared
          #     a fixture with the mismatch case, so a mutation that let bad
          #     bytes through corrupted the file and this case went red for the
          #     PREVIOUS case's reason - coverage it did not have.
          #   write straight to the destination              2 predicted, 3 red
          #     Extra: "applying one file exits 0" - source and destination
          #     become one path, so the rename fails. Accounted for.
          #   .trellis/baseline read reinstated              1 -> 1 red
          #   not-in-upstream-manifest guard dropped         2 predicted, 1 red
          #     READ THIS BEFORE TOUCHING THAT GUARD. Only the MESSAGE case goes
          #     red. The hash check catches the same path a line later (an empty
          #     expected hash never matches), so the exit code cannot tell the
          #     two refusals apart and the exit-2 case is vacuous for this
          #     mutation. The guard's whole surviving value is saying "removing
          #     it is your call, by hand" rather than printing a confusing hash
          #     mismatch. Deliberately not contrived into a red. The first draft
          #     was worse still: never-shipped.md was absent from the source dir
          #     too, so the run exited 2 because the READ failed and the case
          #     proved nothing whatsoever.
          #   --write copy guard removed                     4 -> 4 red
          #
          # Third pass, --verify. This mode exists because of a defect in the
          # RELEASE CUT, not in the tool: v1.2.0 was tagged with its manifest
          # generated one step too early - written, then a decision-log entry
          # appended, then committed - and a pristine clone of that tag
          # reported docs/decision-log.md as `localonly` to an adopter who had
          # changed nothing, which also masks any later upstream change to it.
          # --check passed throughout and was right to; it asks a different
          # question. Hence a new mode rather than a stricter --check.
          #
          #   hash comparison removed                        4 -> 4 red
          #   verify stops reporting a vanished file         2 predicted, 3 red
          #     The extra is a section D --check case: both modes share that
          #     code path, so breaking it breaks --check too. Note the verify
          #     EXIT-CODE case stays green - another mismatch in the same
          #     fixture keeps problems above zero - and only the message case
          #     distinguishes them. Third time that shape has appeared in this
          #     ledger, which is the argument for asserting message text.
          #   --check silently becomes --verify              2 predicted, 1 red
          #     "does not claim it compared hashes" stays green: the success
          #     message keys off MODE, which is still check, so that case
          #     cannot go red under this mutation. It earns its red under a
          #     mutation of the message branch instead.
          #
          # Second pass, after a cross-model review found three defects this
          # suite was already green and mutation-validated over. Each is now a
          # case in section G; these are the mutations that keep them honest.
          #
          #   host dropped from the identity check           1 -> 1 red
          #     Paired with "the template can still --write", which uses the
          #     SAME owner/repo path on github.com. Only the host differs, so
          #     the verdict is attributable to the host and nothing else.
          #   traversal guard removed                        6 predicted, 4 red
          #     The ../ arm goes fully red, including the file outside the copy
          #     actually being overwritten - the first fixture could not do that
          #     (the fetch failed anyway) and the case proved nothing until the
          #     source dir was restructured so the attack works without the
          #     guard. The ABSOLUTE arm keeps 2 green: `$ROOT/$p` with a leading
          #     slash lands back under ROOT rather than escaping, and the read
          #     then fails, so it exits 2 for a different reason. Only the
          #     MESSAGE case can tell those apart, and it does. Same shape as
          #     the not-in-manifest ledger entry above: where an exit code
          #     cannot distinguish two refusals, the text is the assertion.
          #   exec-bit preservation removed        named set matched, 2 red
          #     Predicted count said 3 and named 2; the named set is what was
          #     checked and it matched. "an updated plain file does not gain
          #     one" stays green on purpose - a fetched file is already 644, so
          #     that case is about not ADDING a bit and cannot go red here. It
          #     earns its red under its own mutation (forcing chmod +x).
          #   shebang arm only removed                       1 -> 1 red
          #
          # Ledger from the previous round, still standing:
          #
          #   manifest --check stops stripping CR           1 -> 1 red
          #   sync classifier stops stripping CR            0 red ON WINDOWS
          #     Stated as measured, not rounded up. MSYS awk strips a trailing
          #     CR at input (verified: field length 10, not 11), so on Windows
          #     the classifier is accidentally immune and the mutation cannot
          #     go red there. `bash read` does NOT strip it, which is why
          #     --check broke and the classifier did not. On Linux awk keeps
          #     the CR, so the strip is load-bearing there - this step is the
          #     only place that claim gets exercised, and it has not been
          #     mutation-measured on Linux. The strip stays because it is
          #     correct and free, not because it is covered.
          #   apply ignores whether upstream changed        2 -> 2 red
          #     The first draft of the suite had no case for this, so the
          #     mutation went 0 red over 33 green - a hole sitting directly over
          #     the most damaging thing this tool could do, offering to replace
          #     a filled-in AGENTS.md with the blank template. The baseline that
          #     made it reachable has since been removed outright, and a case
          #     now asserts that putting one back moves no verdict.
          #   localonly drops its local-change half        3 -> 3 red
          #   converged-content check removed              1 -> 1 red
          #   empty upstream manifest accepted             2 -> 2 red
          #   missing local manifest accepted              2 -> 2 red
          #   manifest: empty-is-an-error removed          2 -> 2 red
          #     Was 1 until the message assertion stopped using the alternation
          #     `did not run|empty` - the broken version still printed "empty",
          #     so the case could not tell them apart.
          #   manifest: file-exists check removed          2 -> 2 red
          #   manifest: self-exclusion removed             1 -> 1 red
          #     Was 0 until the fixture TRACKED the manifest: `git ls-files`
          #     lists only tracked files, so an untracked one is excluded by
          #     accident and the case passes with the exclusion deleted.
          bash bin/tests/test-trellis-sync.sh

      - name: Suite - trellis-survey (what is present vs what runs)
        run: |
          # The survey notices things that look EXACTLY like a working setup: a
          # hook on disk nothing invokes, a hook settings.json invokes that is
          # not on disk, a git hook without its exec bit, a router pointing at
          # a deleted skill. All silent in normal use, so this suite is the
          # only thing between them and going unnoticed.
          #
          # Mutation ledger, measured 2026-09-22 over 31 cases.
          #
          #   section() back to `case "$kind" in $1)`      1 -> 1 red
          #     This was a REAL shipped defect, not a synthetic mutation. A `|`
          #     arriving from a variable is an ordinary character in a case
          #     pattern, not alternation, so every multi-kind section matched
          #     nothing while the total still counted those findings: the
          #     report said "5 finding(s)" and printed two. Found by running it
          #     against a real copy, not by reading it - and shellcheck's
          #     SC2254 was pointing straight at it, which is worth recalling
          #     before disabling a warning because the glob looks intended.
          #   dangling-router check removed                1 -> 1 red
          #   wired-but-absent hook check removed          2 -> 2 red
          #   examined-nothing reports clean               2 -> 2 red
          #   template exemption drops the host check      1 -> 1 red
          #
          # Second pass, after a cross-model review found two holes in the very
          # class this script exists to detect.
          #
          #   the two hook directions back behind one &&    1 -> 1 red
          #   missing-hook direction requires the hooks dir 2 -> 2 red
          #     Together these are the real defect: with one `&&`, deleting
          #     .claude/hooks/ while settings.json still named those scripts
          #     produced a CLEAN survey, while the harness called a hook that
          #     did not exist on every matching tool call.
          #   hooksPath non-empty treated as installed      2 predicted, 3 red
          #     Extra: "and lands under NOT RUNNING" - same finding, its
          #     heading case. Flagged as likely in the prediction.
          #   relative paths stop resolving against root    2 predicted, 2 red,
          #                                                 DIFFERENT SET
          #     Predicted "pointing somewhere else is reported" would go red.
          #     It does not, and the reason is worth keeping: with the root
          #     prefix gone the cd fails, so the path is STILL reported as
          #     elsewhere - correct verdict, wrong reason. That case is simply
          #     insensitive to this mutation. The two that did go red are the
          #     equivalence pair, which is what makes the resolution testable
          #     at all. A predicted case that stays green is passing for a
          #     reason you have not accounted for; this is that, written down.
          #
          # One exec-bit case SKIPS where the filesystem cannot carry the mode
          # both ways (MSYS on NTFS keeps +x and ignores -x). It is announced
          # rather than silently counted as a pass, and CI is Linux, so here it
          # runs. The probe tests BOTH directions on purpose: checking only that
          # chmod +x sticks let the case run on a filesystem where it could
          # never go red.
          #
          # Additional ledger, measured 2026-09-30 on Git for Windows:
          #   restore Cursor prune bug -> both optional-adapter cases, 2 -> 2
          #   bypass Codex receipt refusal -> empty, unknown, truncated and
          #     inconsistent-status receipts, 4 -> 4
          # 46 assertions pass on NTFS; the exec-bit case announces its skip.
          bash bin/tests/test-trellis-survey.sh

      - name: Manifest is well formed
        run: |
          # Deliberately NOT a check that the manifest matches the working tree.
          # It describes a RELEASE, not the current state of main, so requiring
          # it to match every commit would be wrong and would make every PR
          # regenerate it. What must hold is that it parses and that nothing it
          # names has vanished. An empty manifest exits 2 rather than 0, because
          # a generator that produced nothing is not a clean result.
          bash bin/trellis-manifest.sh --check
      - name: Template logs ship only their examples
        # Only in the template itself. A copy inherits this workflow and is
        # SUPPOSED to fill these files with its own entries, so the check must
        # never run there - and github.repository, unlike a file in the tree,
        # cannot be copied along with the template.
        if: github.repository == 'craigcossairt/trellis'
        run: |
          # docs/decision-log.md and docs/common-gotchas.md ship to every copy
          # (they are in the manifest), so a real entry here becomes part of an
          # adopter's own project history. The template's own maintenance
          # history is kept in commits and pull requests. The entries
          # got here because appending to the decision log is exactly what every
          # agent working in this template is told to do, which is why this is a
          # check rather than a sentence.
          #
          # A real entry is a dated decision line or a gotchas table row that is
          # not marked "(Example - delete me)". A file that cannot be read is
          # exit 2, never a pass.
          #
          # Mutation-validated (each failed exactly as predicted):
          #   a real decision-log entry appended           -> 1, names the line
          #   a real gotchas row appended                  -> 1, names the line
          #   docs/decision-log.md missing                 -> 2
          #   a real row under a '| --- |' separator       -> 1 (was 0: fail open)
          fail=0
          for f in docs/decision-log.md docs/common-gotchas.md; do
            [ -r "$f" ] || { echo "::error::cannot read $f - the check did not run"; exit 2; }
          done
          out=$(awk '
            FILENAME ~ /decision-log/ && /^- \*\*[0-9][0-9][0-9][0-9]-/ && !/\(Example - delete me\)/ { print FILENAME ":" FNR }
            # Separator rows are recognised by shape (only | - : and spaces), not
            # by an exact "|---" prefix: "| --- |" and "|:---|" are just as valid
            # Markdown, and a separator the check failed to see used to leave it
            # blind to every row below (fail open; Grok review on #24).
            FILENAME ~ /common-gotchas/ && /^\|[ :|-]*$/ { next }
            FILENAME ~ /common-gotchas/ && /^\|/ && !hdr { hdr = 1; next }
            FILENAME ~ /common-gotchas/ && /^\|/ && !/\(Example - delete me\)/ { print FILENAME ":" FNR }
          ' docs/decision-log.md docs/common-gotchas.md) || { echo "::error::awk failed - the check did not run"; exit 2; }
          if [ -n "$out" ]; then
            while IFS=: read -r file line; do
              echo "::error file=$file,line=$line::a real entry in a template log. Keep template maintenance history in commits and pull requests; these files ship to every copy."
            done <<< "$out"
            fail=1
          fi
          echo "template logs checked"
          exit $fail

  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        if: hashFiles('.agents/**', '.codex/**') != ''
        with:
          python-version: '3.13'

      - name: Codex routers and static hook wiring
        if: hashFiles('.agents/**', '.codex/**') != ''
        run: python bin/validate-codex.py

      - name: Suite - Codex wiring validator
        if: hashFiles('.agents/**', '.codex/**') != ''
        run: python -m unittest discover -s bin/tests -p test_codex_validation.py -v

      - name: Suite - Codex hook adapter and Windows launcher
        if: hashFiles('.codex/**') != ''
        run: python -m unittest discover -s bin/tests -p test_codex_hooks.py -v

      # GitHub's bash shell on Windows is Git for Windows. The same hermetic
      # suites run here without installing Linux packages or using WSL.
      - name: Suite - push gate on Git for Windows
        run: bash bin/tests/test-push-gate.sh
      - name: Suite - sensitive-file block on Git for Windows
        run: bash bin/tests/test-block-sensitive-files.sh
      - name: Suite - session-start on Git for Windows
        run: bash bin/tests/test-session-start.sh
      - name: Suite - CDPATH checker on Git for Windows
        run: bash bin/tests/test-check-cdpath-cd.sh
      - name: Suite - trellis-survey on Git for Windows
        run: bash bin/tests/test-trellis-survey.sh
      # These three were missing here with no reason recorded. All three pass
      # on Git for Windows (measured 2026-09-30: 18, 80 and 87 cases), so the
      # gap was an unargued skip, not a platform limit.
      - name: Suite - claim-branch on Git for Windows
        run: bash bin/tests/test-claim-branch.sh
      - name: Suite - claim-branch lease on Git for Windows
        run: bash bin/tests/test-claim-branch-lease.sh
      - name: Suite - trellis-sync on Git for Windows
        run: bash bin/tests/test-trellis-sync.sh
      # The shared-checkout pieces lean on path spellings (git's C:/ form
      # beside Git Bash's /c/ form), which differ on Windows. Same suites,
      # ledgers on the Linux steps above.
      - name: Suite - check-main-checkouts on Git for Windows
        if: hashFiles('bin/check-main-checkouts.sh') != ''
        run: bash bin/tests/test-check-main-checkouts.sh
      - name: Suite - session-start main-checkout section on Git for Windows
        if: hashFiles('bin/check-main-checkouts.sh') != ''
        run: bash bin/tests/test-session-start-main-checkout.sh
