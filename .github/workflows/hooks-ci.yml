          #   installer's own unset removed                 2 -> 2 red
          #     The two direct-installer cases. Through session-start the
          #     variables are already gone.
          #   both removed                                  6 -> 6 red
          bash bin/tests/test-session-start.sh

      - name: CDPATH-guarded self-location
        run: |
          # Hard gate, no budget: every cd into a script's own directory
          # (`$(dirname ...)`, `${BASH_SOURCE[0]%/*}`, `${0%/*}`) carries an
          # EMPTY CDPATH= prefix. Unguarded, a script run by a relative path
          # with CDPATH exported captures its directory twice and loses every
          # sibling. The Cursor/Grok adapter is invoked exactly that way and
          # fails open on a missing target, so this let a .env write through.
          # `bash bin/check-cdpath-cd.sh --list` prints every site.
          bash bin/check-cdpath-cd.sh

      - name: Suite - CDPATH checker
        run: |
          # Every case runs against a throwaway repo; scanning this tree only
          # proves the tree is clean today. 37 cases.
          #
          # Mutation ledger, measured 2026-09-30 over 37 cases. Predicted case
          # sets were named before each run:
          #
          #   a non-empty CDPATH prefix counts as a guard   1 -> 1 red
          #   comment-line skip removed                     9 -> 9 red
          #     Every fixture carries the checker, whose header quotes the
          #     bad form, so all nine expected-clean cases go red.
          #   per-line guard (any guard clears the line)    1 -> 1 red
          #   cd options (-P) not recognized                2 -> 2 red
