# Lint gate for the guardrails themselves. Every hook and helper script here is
# safety infrastructure: a script that dies on CRLF, a syntax error, or a missing
# exec bit fails SILENTLY (git skips a non-executable hook without a word), and a
# guardrail that no-ops is indistinguishable from one that passes. So the scripts
# get their own CI. Runs in seconds.
#
# The config files get the same treatment for the same reason. A trailing comma in
# .claude/settings.json does not fail loudly - Claude Code declines to load the file
# and every hook it wires stops firing, which means the sensitive-file block and the
# push gate are simply gone. A skill with malformed frontmatter is not an error
# either, it is silently skipped, so the skill never runs and nothing says so.
name: hooks-ci

# NO paths filter, deliberately. There was one, listing shell scripts,
# .githooks, .claude, .cursor and .grok - and it silently excluded the inputs of
# two of the checks below. The credits gate reads docs/recommended-tooling.md
# and CREDITS.md; the manifest gate reads .trellis/manifest. A pull request
# touching only those ran neither, so "CI fails when a recommendation has no
# credit line" was true only when a shell script happened to change in the same
# PR. docs/harness-support.md meanwhile told readers this job runs on every
# pull request, which was the claim the filter falsified. A filter on a job that
# is lint plus a handful of hermetic suites, and finishes in seconds, buys
# nothing and costs the coverage its own docs promise.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    # Least privilege, and it matters MORE here than in an ordinary workflow:
    # the behavioral steps below execute scripts out of the checked-out tree, so
    # on a pull_request this job runs code the PR author wrote. Without an
    # explicit block the job inherits the repository default, which can be
    # read/write - and every project created from this template inherits
    # whatever this file says, into a contributor model that may not look like
    # this one. Nothing here needs to write.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # actions/checkout persists the job token for later git commands by
          # default, and `contents: read` above limits what that token can DO
          # without changing who can reach it. Stated as the EFFECT on purpose:
          # an earlier draft of this comment named the storage mechanism, which
          # varies by action version and which had not been verified - a comment
          # asserting a mechanism it cannot demonstrate is worse than one that
          # sticks to what is observable. The behavioral steps below run shell
          # out of this checkout, so on a pull_request that is PR-author code
          # running beside a live credential. The suites build throwaway local
          # repos with `git init --bare` and never reach a remote, so dropping
          # it costs nothing here.
          persist-credentials: false

      - name: Every suite is wired
        run: |
          # A suite that exists but that nothing runs reads as coverage: its docs
          # say what it proves and nobody notices CI never calls it. Named steps
          # below carry the mutation ledgers, so this compares the suite files on
          # disk with the INVOCATIONS in this workflow and fails on one nothing
          # runs. Only executable lines count: comment lines are dropped first,
          # so a commented-out step or a suite named only in a mutation ledger
          # is not "wired". An invocation is `bin/tests/<name>` (shell suites)
          # or `-p <name>` (unittest discovery). A skip must be argued: add
          # `name: reason` to SKIP. A glob that matches nothing is
          # could-not-run, never "all wired".
          SKIP=""
          runs=$(grep -vE '^[[:space:]]*#' .github/workflows/hooks-ci.yml) || {
            echo "::error::could not read the workflow - this check could not run"; exit 1; }
          found=0; missing=0
          for f in bin/tests/test-*.sh bin/tests/test_*.py; do
            [ -e "$f" ] || continue
            found=$((found + 1))
            name=$(basename "$f")
            case "$SKIP" in *"$name:"*) continue ;; esac
            if ! printf '%s\n' "$runs" | grep -qF -e "bin/tests/$name" -e "-p $name"; then
              echo "::error file=$f::$name is not run by hooks CI and not on the SKIP list with a reason"
              missing=$((missing + 1))
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no suite files matched bin/tests/test-* - this check could not run"
            exit 1
          fi
          [ "$missing" -eq 0 ] || exit 1
          echo "every suite is wired: $found suite file(s)"

      - uses: actions/setup-python@v7
        if: hashFiles('.agents/**', '.codex/**') != ''
        with:
          python-version: '3.13'

      - name: No CRLF line endings (breaks bash at the first line)
        run: |
          # grep exits 0 on match, 1 on no-match, and 2 on ERROR. Both the old
          # `xargs grep -l ... || true` and a plain `if grep -q ...` collapse the
          # error case into "clean", so a scan that never ran reads exactly like a
          # scan that found nothing - here that means an unreadable or missing file
          # is reported as LF. Unknown must never resolve to green, and that
          # applies to the checks themselves, not only to what they check. So all
          # three exit codes are handled separately.
          # `rc=0; cmd || rc=$?` and not `cmd; rc=$?`: this runs under `bash -e`,
          # where a bare non-zero simple command kills the step. Written the naive
          # way, the FIRST clean file (grep exit 1) aborts the run - and the step
          # then fails for every tree, which looks like a working check until you
          # notice it can never pass.
          fail=0
          while read -r f; do
            rc=0
            grep -qU $'\r' "$f" || rc=$?
            case $rc in
              0) echo "::error file=$f::contains CRLF line endings (see .gitattributes)"; fail=1 ;;
              1) ;;
              *) echo "::error file=$f::could not be scanned for CRLF (grep exit $rc) - tracked but missing or unreadable"; fail=1 ;;
            esac
          done < <(git ls-files '*.sh' '.githooks/*' 'brain/bin/qmd')
          exit $fail

      - name: bash -n (syntax) on every script
        run: |
          fail=0
          while read -r f; do
            bash -n "$f" || { echo "::error file=$f::bash -n failed"; fail=1; }
          done < <(git ls-files '*.sh' '.githooks/*' 'brain/bin/qmd')
          exit $fail

      - name: shellcheck
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
          git ls-files '*.sh' '.githooks/*' | xargs -r shellcheck -S warning -x

      - name: Exec bits on git hooks (git skips non-executable hooks silently)
        run: |
          git ls-files -s '.githooks/*' 'bin/*' | while read -r mode _ _ f; do
            if [ "$mode" != "100755" ]; then
              echo "FAIL: $f has mode $mode - must be 100755."
              echo "Fix: git update-index --chmod=+x '$f'"
              exit 1
            fi
          done

      - name: Agent, skill, command and router definitions (frontmatter + LF + targets)
        run: |
          # None of the steps above read these files at all. A malformed definition
          # is not an error - the harness silently skips it, so the skill, command
          # or agent simply never fires. Same invisible failure, different file type.
          fail=0
          shopt -s nullglob

          # check <file> <expected-name-or-empty> <required keys...>
          check() {
            local f="$1" expect="$2" fm key declared
            shift 2
            # A bare `if grep -q` is fine HERE and not in the step above: these
            # paths come from a glob over the working tree, so the file provably
            # exists and grep's error case is not reachable. Where the list comes
            # from git rather than the disk, the exit code has to be split.
            if grep -qU $'\r' "$f"; then
              echo "::error file=$f::contains CRLF line endings"
              fail=1
            fi
            # Frontmatter must open on line 1; anything else and the whole block is
            # read as body text.
            if [ "$(head -n 1 "$f")" != "---" ]; then
              echo "::error file=$f::must start with '---' frontmatter"
              fail=1
              return
            fi
            # END{exit !found} is the point. Without it a file whose frontmatter
            # never closes prints its entire body as the frontmatter block, and
            # every key check below then passes on body text.
            if ! fm=$(awk 'NR>1 && /^---$/{found=1; exit} NR>1{print} END{exit !found}' "$f"); then
              echo "::error file=$f::frontmatter is missing a closing '---'"
              fail=1
              return
            fi
            for key in "$@"; do
              if ! printf '%s\n' "$fm" | grep -qE "^$key:[[:space:]]*[^[:space:]]"; then
                echo "::error file=$f::frontmatter missing '$key:'"
                fail=1
              fi
            done
            # The name is the handle the harness dispatches on. One that disagrees
            # with its file or directory is invoked by one string and found under
            # another.
            if [ -n "$expect" ]; then
              declared=$(printf '%s\n' "$fm" | sed -n 's/^name:[[:space:]]*//p' | head -n 1)
              if [ "$declared" != "$expect" ]; then
                echo "::error file=$f::frontmatter name '$declared' != '$expect'"
                fail=1
              fi
            fi
          }

          agents=(.claude/agents/*.md)
          skills=(.claude/skills/*/SKILL.md)
          commands=(.claude/commands/*.md)
          # "Not present" and "present but empty" are different, and only one of
          # them is a problem. SETUP.md § 5 says to delete skills and agents a
          # project does not need, so an absent directory is a deliberate prune and
          # this check simply does not apply. A directory that exists with nothing
          # in it is a rename or a half-finished delete, which must not read as a
          # pass - that is the failure mode this whole workflow is about.
          for d in .claude/agents .claude/skills .claude/commands; do
            [ -d "$d" ] || continue
            case "$d" in
              .claude/agents)   [ ${#agents[@]}   -gt 0 ] || { echo "::error::$d exists but holds no definitions - renamed or half-deleted"; fail=1; } ;;
              .claude/skills)   [ ${#skills[@]}   -gt 0 ] || { echo "::error::$d exists but holds no SKILL.md - renamed or half-deleted"; fail=1; } ;;
              .claude/commands) [ ${#commands[@]} -gt 0 ] || { echo "::error::$d exists but holds no protocols - renamed or half-deleted"; fail=1; } ;;
            esac
          done

          for f in "${agents[@]}"; do check "$f" "$(basename "$f" .md)" name description; done
          for f in "${skills[@]}"; do check "$f" "$(basename "$(dirname "$f")")" name description; done
          # Commands carry `description` only - they are protocol documents, not
          # dispatchable agents, and none of them declares a `name`. Requiring one
          # here would fail all three for a key the format does not use.
          for f in "${commands[@]}"; do check "$f" "" description; done

          echo "checked ${#agents[@]} agent(s), ${#skills[@]} skill(s), ${#commands[@]} command(s)"

          # ---- Cursor routers -------------------------------------------------
          # Same step, deliberately: a router is a definition too, and it has to
          # clear the same frontmatter bar before its target is worth reading. A
          # router with a broken fence never loads in Cursor, yet it can still
          # contain a backticked path that satisfies a target check - so target
          # coverage alone would pass a file the harness ignores. Steps do not
          # share shell state, so validating them anywhere else means a second
          # copy of check(), which is the drift this workflow exists to catch.
          #
          # Two more ways routers rot, both invisible without a check:
          #
          #  1. A router pointing at a renamed or deleted file still parses, still
          #     loads, and sends the agent somewhere that is not there. Renaming a
          #     skill does not touch its router.
          #  2. A new skill with no router is exactly as unreachable from Cursor as
          #     a malformed one. A rule with no check behind it is the failure mode
          #     this workflow exists to prevent, so both directions are checked.
          #
          # A project that deleted the whole Cursor adapter (SETUP.md § 5) is not
          # broken, it just has nothing to check. Keeping the adapter is what opts
          # you into keeping it complete.
          if [ ! -d .cursor ]; then
            echo "no Cursor adapter in this project - nothing to check"
            exit $fail
          fi

          routers=(.cursor/skills/*/SKILL.md)
          if [ ${#routers[@]} -eq 0 ]; then
            echo "::error::.cursor/ is present but has no skill routers - every skill and command is unreachable from Cursor. Add routers under .cursor/skills/, or delete .cursor/ entirely."
            exit 1
          fi

          covered=""
          for f in "${routers[@]}"; do
            check "$f" "$(basename "$(dirname "$f")")" name description
            # `rc=0; cmd || rc=$?` and not `x=$(cmd | tr ...)`: today the pipeline
            # ends in tr, so grep's exit 1 is masked and `bash -e` lets a
            # no-target router reach its error branch. That is luck, not design -
            # adding `set -o pipefail` would kill the step instead. Split the
            # three exit codes explicitly, so a grep that ERRORS is also not
            # silently read as "no targets".
            rc=0
            targets=$(grep -oE '`\.claude/[^`]+`' "$f") || rc=$?
            case $rc in
              0) targets=$(printf '%s\n' "$targets" | tr -d '`') ;;
              1) targets="" ;;
              *) echo "::error file=$f::could not be scanned for targets (grep exit $rc)"; fail=1; continue ;;
            esac
            if [ -z "$targets" ]; then
              echo "::error file=$f::names no .claude/ target, so it routes nowhere"
              fail=1
              continue
            fi
            while read -r target; do
              [ -z "$target" ] && continue
              if [ ! -e "$target" ]; then
                echo "::error file=$f::points at '$target', which does not exist"
                fail=1
              fi
            done <<< "$targets"
            covered="$covered$targets"$'\n'
          done

          for canon in .claude/skills/*/SKILL.md .claude/commands/*.md; do
            [ -e "$canon" ] || continue
            if ! printf '%s' "$covered" | grep -qxF "$canon"; then
              echo "::error file=$canon::no Cursor router points at this - add one under .cursor/skills/"
              fail=1
            fi
          done

          echo "checked ${#routers[@]} Cursor router(s)"
          exit $fail

      - name: Codex routers and static hook wiring
        if: hashFiles('.agents/**', '.codex/**') != ''
        run: python bin/validate-codex.py

      - name: Suite - Codex wiring validator
        if: hashFiles('.agents/**', '.codex/**') != ''
        run: |
          # Mutation ledger, measured 2026-09-30 over 19 test methods. Named
          # sets matched predictions; failing subcases are counted separately:
          #   drop canonical coverage -> skill, command and receipt, 3 -> 3
          #   skip frontmatter -> keys, fences, LF, scalar grammar, 20 -> 20
          #   skip operation check -> each event on each platform, 8 -> 8
          #   skip literal script existence -> custom script, 1 -> 1
          #   glob swallows scan error -> failed inspection, 1 -> 1
          #   ignore matcher -> Pre/PostToolUse + startup coverage, 3 -> 3
          python -m unittest discover -s bin/tests -p test_codex_validation.py -v

      - name: Suite - Codex hook adapter
        if: hashFiles('.codex/**') != ''
        run: |
          # Mutation ledger, measured 2026-09-30; 14 methods now pass. Named sets matched:
          #   inspect only first patch target -> mixed-patch case, 1 -> 1 red
          #   drop named symlink spelling -> symlink case, 1 -> 1 red
          #   swallow canonical nonzero -> policy-failure case, 1 -> 1 red
          #   exact envelope marker comparison -> whitespace subcases, 6 -> 6 red
          # Configured-command cases exercise cmd and PowerShell. Structured
          # deny output preserves blocking through either outer shell, including
          # policy denial, missing hooks.py and a missing Git root.
          # Ledger, measured 2026-09-30 (ported from a downstream review); each
          # named case and only it went red:
          #   splitlines() instead of a newline split -> separator case, 1 red
          #   context errors exit 2 again             -> missing-brain case, 1 red
          #   bad cwd raises for context hooks        -> bad-cwd case, 1 red
          #   launcher drops its context branch       -> context-commands case, 1 red
          #   brain timeout above its launcher's      -> timeout case, 1 red
          python -m unittest discover -s bin/tests -p test_codex_hooks.py -v

      # ---- behavioral suites ----------------------------------------------
      # Static checks prove the definitions load, not that the guardrails do
      # what they claim. The Python suites above and Bash suites below exercise
      # real fixtures. Earlier versions shipped behavioral suites without
      # invoking them in CI, so keep each suite visible as its own named step.
      #
      # One NAMED step per suite, deliberately. A single "run the tests" step
      # reports one conclusion for everything, so a reader has to open the log
      # to learn which guardrail broke - and a step name is what people read.
      #
      # Each step carries the MUTATION LEDGER for its suite: which cases go red
      # when the thing under test is broken. A suite whose ledger is empty has
      # never been shown to assert anything, and a green suite is not evidence
      # until it has been. Predict the set BEFORE running the mutation and read
      # WHICH cases failed - a count alone proves nothing - and confirm the
      # mutation actually changed the file, because a pattern that no longer
      # matches leaves the mutant byte-identical and its all-green run reads as
      # "my suite does not cover this".

      - name: Every recommended tool is credited
        run: |
          # CREDITS.md only works if adding a tool and crediting it are one
          # action. Left to memory they separate immediately, and the file
          # becomes a partial list nobody trusts - which is worse than no file,
          # because it answers "is this everything?" with an apparent yes.
          #
          # Matched on the `Source:` URL rather than the project name: names get
          # written three ways (gstack, GStack, Garry's stack) and a fuzzy match
          # would pass on a near-miss. The URL is exact or it is absent.
          #
          # Three outcomes kept apart on purpose. Missing credit is a FAILURE.
          # Either file being absent or yielding no URLs is a could-not-run and
          # exits non-zero too, because a check that silently examined nothing
          # is the thing this repo keeps warning about.
          fail=0
          [ -f docs/recommended-tooling.md ] || { echo "::error::docs/recommended-tooling.md is missing - this check examined nothing"; exit 1; }
          [ -f CREDITS.md ] || { echo "::error::CREDITS.md is missing - this check examined nothing"; exit 1; }
          # Trailing content after the URL is allowed. Anchoring to end-of-line
          # looked right and silently skipped the one entry written as
          # `Source: <url> (owner/repo)` - the check then reported success over
          # a set it had quietly under-collected, which is the failure this repo
          # keeps warning about wearing a different hat.
          urls="$(sed -n 's|^Source: *\(https\?://[^ ]*\).*|\1|p' docs/recommended-tooling.md | sed 's|[.,)]*$||' | sort -u)"
          if [ -z "$urls" ]; then
            echo "::error file=docs/recommended-tooling.md::found no 'Source:' URLs - the extractor is broken, or the file's format changed"
            exit 1
          fi
          # The extractor must account for every Source: line, not just the ones
          # it happened to parse. Without this, a future format change makes the
          # check cover less and say nothing about it.
          declared="$(grep -c '^Source:' docs/recommended-tooling.md || true)"
          extracted="$(printf '%s\n' "$urls" | grep -c .)"
          if [ "$declared" != "$extracted" ]; then
            echo "::error file=docs/recommended-tooling.md::$declared 'Source:' lines but only $extracted URLs parsed - the extractor is missing entries"
            exit 1
          fi
          n=0
          while IFS= read -r u; do
            [ -n "$u" ] || continue
            n=$((n + 1))
            if grep -qF "$u" CREDITS.md; then
              echo "ok   $u"
            else
              echo "::error file=CREDITS.md::$u is recommended in docs/recommended-tooling.md but has no line in CREDITS.md"
              fail=1
            fi
          done <<< "$urls"
          echo "checked $n recommended source(s)"
          exit $fail

      - name: Suite - claim-branch (author signal)
        run: |
          # Mutation ledger, measured 2026-09-08 over 18 cases. Format is
          # predicted -> actual, because a count that was never predicted is not
          # a result.
          #
          #   author-path ls-remote error branch -> exit 0    1 -> 1 red
          #     ("an origin that fails on the BRANCH read ...")
          #
          # Recorded because it is easy to get wrong twice: that mutation used
          # to produce 0 red. The lease check now runs FIRST, so an origin that
          # is simply down fails inside lease_read and the two older
          # "unreachable origin" cases exit 2 there without ever reaching the
          # author path. They still assert the right verdict; they stopped
          # asserting it about the code they were written for. The shim case
          # that fails only the SECOND ls-remote is what covers it now.
          #
          # Re-measured 2026-09-30 after leases moved to refs/heads/claims/:
          # the same mutation, 1 -> 1 red. The shim now fails the branch read by
          # REF NAME. It used to count calls, and the lease read grew a second
          # ls-remote (the probe of the old refs/claims/ namespace), so "the
          # second call" stopped being the branch read.
          bash bin/tests/test-claim-branch.sh

      - name: Suite - claim-branch (lease)
        run: |
          # Mutation ledger, measured 2026-09-08 over 80 cases:
          #
          #   has-not-moved guard on a refused lease push     3 -> 3 red
          #     A refused push is not proof somebody beat us: on a takeover the
          #     CAS is pinned to the sha we read, so an unchanged sha means the
          #     push failed for its own reasons. Reporting CLAIMED there sends
          #     the operator to coordinate with a session that is not there.
          #   unrecognised lease state falls through          NO TEST
          #     Recorded rather than left implied: lease_read returns only
          #     NONE/MINE/HELD/EXPIRED, so the new refusal arm cannot be driven
          #     without mutating lease_read itself. It guards a fifth token a
          #     later change might add. Unreachable-by-construction, not
          #     untested-by-omission - and the difference is worth writing down.
          #
          #   count_lines call-site status check removed      3 -> 5 red
          #     Predicted 3 and got 5, and the extra two are the point: this
          #     one check is the single gate BOTH awk failure classes flow
          #     through, so it subsumes the shape check below. The fail-open it
          #     closes is what the awk rewrite left behind - swapping out
          #     `grep -c . || true` fixed the construct, and an unchecked
          #     assignment still let a blank count reach a FREE verdict.
          #   numeric shape check inside count_lines removed  2 -> 2 red
          #     Only the silent-awk pair. An awk that exits 0 printing nothing
          #     satisfies the status check, so shape has to be read too.
          #   collide shim never matches `fetch` (FIXTURE)    2 -> 2 red
          #     A mutation of the fixture rather than the code, because the
          #     poison case's verdict is ALSO what correct code produces when
          #     the poison never lands. Only the two sanity assertions move.
          #
          #   tmpref reverted to a FIXED ref name             1 -> 2 red
          #     The poison case fired on `git log` until review pointed out
          #     that lease_read resolves the ref with rev-parse FIRST and hands
          #     the resolved sha to log - so there was no ref left to poison,
          #     and a fixed-name implementation passed the case anyway. Firing
          #     on `fetch` (real fetch, then clobber) puts it in the window the
          #     $$ suffix actually closes. The mutation battery could not find
          #     this: it perturbs code you already wrote, and this was a gap
          #     between the fixture and reality.
          #   perl-availability guard removed                 2 -> 2 red
          #     Exit stays 2, so only the two MESSAGE cases move. That is the
          #     point: an error message is an instruction, and blaming --now
          #     for a missing interpreter sends the operator to fix the one
          #     thing that is not broken.
          #
          #   --force-with-lease -> --force                   2 -> 2 red
          #     Only the "moved BEFORE the push" pair goes red. The two
          #     mid-push races stay green on purpose: git refuses those on its
          #     own, so they pin the behaviour while the third pins the flag.
          #   session_id_path uses --git-common-dir           3 -> 3 red
          #     The first run of this one gave 2, and the case that stayed green
          #     ("worktree B does not see A's id file") was the reason: it
          #     checked only B's own path, which is empty whether the id landed
          #     in A's git dir or in the SHARED common dir - the exact place the
          #     wrong flag puts it. The case now checks both locations.
          #   ttl range guard removed                         1 -> 1 red
          #   unparseable lease marker treated as NONE        1 -> 1 red
          #   grep -qxF -> grep -q (regex)                    2 -> 2 red
          #     Also caught a weak assertion: the "verdict SAYS it ignored the
          #     bot" case matched the substring "github-actions", which appears
          #     in the CLAIMED report too, so it was green either way. It now
          #     matches the free path's own wording.
          #   grep -qxF -> grep -qF (drop -x only)            1 -> 1 red
          #     This one was 0 red until the fixture was fixed, and the reason
          #     is worth keeping: the existing near-miss address ("robotham@")
          #     is not a SUBSTRING of any allowlist entry, so dropping -x left
          #     it green. The case that bites is an address the allowlist line
          #     contains - "actions[bot]@users.noreply.github.com" sits inside
          #     "41898282+github-actions[bot]@users.noreply.github.com" - which
          #     a substring match waves through.
          #
          # Additional ledger, measured 2026-09-30 over 95 cases: the warning
          # when --acquire runs from a checkout not on that branch (the id lands
          # where nothing pushes it). Predicted = actual for every row:
          #   never warn                                     4 -> 4 red
          #   inverted branch compare                        5 -> 5 red
          #   no warning on a fresh acquire                  3 -> 3 red
          #   no warning on the re-acquire path              1 -> 1 red
          #   drop the PROJECT_SESSION_ID fix from the text  1 -> 1 red
          #   drop the line naming the stray id file         1 -> 1 red
          #   no warning after a refused push that reads MINE  NO TEST
          #     Reachable only through a push that fails while the lease
          #     already names this session; the same race shims would drive it.
          #
          # Leases moved to refs/heads/claims/<b> with RELEASED markers, a
          # claims/ name guard, --sweep and a could-not-tell probe of the old
          # refs/claims/<b>. Ledger measured 2026-09-30 over 152 cases, with
          # the push-gate suite (51 cases) run too where the real hook matters.
          # predicted -> actual:
          #   release deletes first, marker as fallback      1 -> 1 red
          #   no deletion fallback                           2 -> 2 red
          #   RELEASED read as HELD                          7 -> 10 red
          #     The three extra are the awk cases: they run on a branch that
          #     was released earlier, so a RELEASED-as-HELD lease stops them
          #     before the counting path they test. Push gate: 1 -> 1.
          #   no shape check on the object read              1 -> 1 red
          #     0 red until the fixture changed: a code commit whose message is
          #     "base" fails the marker parser on its own. The fixture's code
          #     commit now carries a well-formed RELEASE message.
          #   RELEASE+CLAIM ambiguity check removed          1 -> 1 red
          #   claims/ flag not checked for inertness         2 -> 2 red (gate 1 -> 1)
          #   claims/ guard removed                          6 -> 6 red (gate 5 -> 5)
          #     The gate's set differed from the one predicted: --acquire still
          #     passes (its ref does not exist yet when the hook runs), and the
          #     RELEASE push is the one refused, as a branch with a foreign
          #     author. Same count, different cases - the set is what counts.
          #   lease push without PROJECT_CLAIM_LEASE_PUSH    0 -> 0 red (gate 3 -> 3)
          #   lease push without PROJECT_SKIP_VERIFY         3 -> 2 red (gate 3 -> 3)
          #     --release survives here: its marker push is refused by the
          #     modelled gate, and the deletion fallback (no tree) goes through.
          #   deletion vouches with an empty sha             0 -> 0 red (gate 2 -> 2)
          #   old-namespace verdict removed                  7 -> 5 red
          #     Two predicted cases stay green because the probe still RUNS;
          #     only its verdict was removed, and the unreadable case fails in
          #     the probe itself. That is the next row.
          #   old-namespace probe failure read as absent     1 -> 1 red
          #   author check: exact-match loop only removed    0 -> 0 red
          #   author check: --heads pattern query only       0 -> 0 red
          #     Each half of the exact-ref fix covers the other.
          #   author check: both halves reverted             9 red (predicted >= 4)
          #   RELEASED not CASed on acquire                  4 -> 4 red
          #   sweep deletes live leases                      2 -> 2 red
          #   sweep skip not counted as a failure            1 -> 1 red
          #
          # Review fixes on PR #32, measured 2026-10-01 over 184 cases (push
          # gate 58 run against every mutation too; 0 red there unless noted).
          # Each mutation ran in a scratch copy; diffs read before running.
          #   id file honoured off-branch (finding 2)        1 -> 1 red
          #   id file never honoured                         4 -> 4 red
          #   refs/ prefix not refused (finding 3)           3 -> 3 red
          #   <remote>/ prefix not refused                   3 -> 3 red
          #   check-ref-format skipped                       1 -> 1 red
          #   D/F clash not diagnosed (finding 5)            3 -> 3 red
          #   branch 'claims' not refused                    3 -> 3 red
          #   --me/--harness charset not checked (finding 7) 7 -> 7 red
          #   RELEASE/CLAIM token not checked                4 -> 4 red
